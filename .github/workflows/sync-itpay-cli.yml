name: Sync ItPay CLI bundle

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-itpay-cli.yml
  repository_dispatch:
    types: [itpay-cli-published]
  workflow_dispatch:

jobs:
  sync:
    uses: itpay-ai/cli/.github/workflows/sync-platform-bundle.yml@main
    permissions:
      contents: write
      pull-requests: write
    with:
      npm-channel: next
      bundle-format: single-file-esm
      bundle-directory: assets/itpay-cli
      version-files: package.json
      track-skill-diff: true
    secrets:
      ITPAY_BUNDLE_APP_ID: ${{ secrets.ITPAY_BUNDLE_APP_ID }}
      ITPAY_BUNDLE_APP_PRIVATE_KEY: ${{ secrets.ITPAY_BUNDLE_APP_PRIVATE_KEY }}
